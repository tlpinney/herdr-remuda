id = "remuda"
name = "Remuda"
version = "0.4.1"
min_herdr_version = "0.9.2"
description = "Pick panes from any machine into a view of your own: live mirrors with selectable resize policies"
platforms = ["linux", "macos"]

# Downloads the signed prebuilt binary for this version, or builds it with
# cargo when no release is available.
[[build]]
command = ["sh", "scripts/install-binary.sh"]

# Puts remuda on PATH so herdr can resume mirrors after a restart.
[[startup]]
command = ["target/release/remuda", "install", "--quiet"]

[[actions]]
id = "pick"
title = "Mirror a pane or open a view"
contexts = ["workspace"]
command = ["target/release/remuda", "open-popup", "pick"]

[[actions]]
id = "save-view"
title = "Save this tab as a view"
contexts = ["workspace"]
command = ["target/release/remuda", "open-popup", "save"]

[[panes]]
id = "pick"
title = "Mirror a pane"
placement = "popup"
width = "80%"
height = "70%"
command = ["target/release/remuda", "pick"]

[[panes]]
id = "save"
title = "Save view"
placement = "popup"
width = 64
height = 8
command = ["target/release/remuda", "save"]

[[panes]]
id = "view"
title = "Remuda"
placement = "split"
command = ["target/release/remuda", "view"]
