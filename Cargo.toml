[package]
name = "remuda"
version = "0.2.0"
edition = "2021"
description = "Pick panes from any machine into a herdr view of your own"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22.1"
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
